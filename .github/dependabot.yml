version: 2
# npm only — there are no workflows for the github-actions ecosystem to update.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # react and react-dom must move together; alone, either one breaks the build.
    groups:
      react:
        patterns: ['react', 'react-dom']
