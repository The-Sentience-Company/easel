name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # macOS only: package.json declares os: ["darwin"], and the daemon installs
    # as a launchd agent.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Puppeteer's Chromium is ~1GB and unchanged between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # postinstall builds the excalidraw bundle the suite checks for staleness.
      - run: npm ci

      - run: npm test
